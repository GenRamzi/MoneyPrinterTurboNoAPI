services:
  moneyprinter-noapi:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./storage:/app/storage
    environment:
      MPT_HOST: 0.0.0.0
      MPT_PORT: 8501
      MPT_OLLAMA_MODEL: ${MPT_OLLAMA_MODEL:-qwen3:8b}
      MPT_GPU_BACKEND: ${MPT_GPU_BACKEND:-auto}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
